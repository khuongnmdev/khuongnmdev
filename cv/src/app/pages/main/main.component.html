<div
  class="app-container"
  [class.sidebar-collapsed]="sidebarCollapsed()"
  [class.sidebar-animating]="sidebarAnimating()"
  (transitionend)="onTransitionEnd($event)"
>
  <app-nav-bar [activeSection]="currentActiveSection()" class="app-nav-bar"></app-nav-bar>
  <main class="main-container">
    <!--
      Sections render in the order the data dictates; disabled ids never get
      here because `sections()` filters them out.

      Scroll-spy: activation triggers when a section overlaps a thin band
      around the middle of the viewport (rootMargin trims the viewport to
      that band, threshold 0 fires on any overlap). A ratio-based threshold
      would break here: a section taller than the viewport can never reach a
      0.5 intersection ratio.
    -->
    @for (section of sections(); track section.id) {
      @if (componentFor(section.id); as sectionComponent) {
        <div
          class="section-host"
          appActiveSection
          rootMargin="-45% 0px -45% 0px"
          [threshold]="0"
          (sectionIntersecting)="onSectionActive(section.id, $event)"
        >
          <ng-container [ngComponentOutlet]="sectionComponent" />
        </div>
      }
    }
  </main>
</div>
