<div class="print-page">
  <header class="print-toolbar screen-only">
    <a class="toolbar-back" routerLink="/">Back to the website</a>
    <label class="toolbar-field">
      Template
      <select
        class="form-select form-select-sm"
        [value]="template()"
        (change)="onTemplateChange($event)"
      >
        @for (option of templates; track option) {
          <option [value]="option" [attr.selected]="option === template() ? '' : null">
            {{ option }}
          </option>
        }
      </select>
    </label>
    <button type="button" class="toolbar-export" [disabled]="exporting()" (click)="exportPdf()">
      Export PDF
    </button>
  </header>

  <p class="print-hint screen-only">
    The preview is one continuous sheet at A4 width — page boundaries appear in the browser's print
    preview.
  </p>

  <div class="print-sheet" #sheet>
    <app-print-cv [template]="template()" />
  </div>
</div>
