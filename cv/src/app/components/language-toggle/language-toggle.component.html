<!--
  `hreflang` names the language each link leads to. The link's text — the
  tooltip and the hidden label that forms its accessible name — is written
  in the language of the current page, so the link carries no `lang` and
  inherits the page's. Only the visible code is in the target language: it
  alone carries `lang`, and it is hidden from assistive technology so it
  stays out of the name.
-->
<div class="lang-toggle" role="group" [attr.aria-label]="ui().language">
  @for (option of options(); track option.locale) {
    <a
      class="lang-option"
      [class.active]="option.active"
      [routerLink]="option.target"
      [attr.hreflang]="option.locale"
      [attr.aria-current]="option.active ? 'page' : null"
      [title]="option.title"
    >
      <span class="lang-code" aria-hidden="true" [attr.lang]="option.locale">{{
        option.code
      }}</span>
      <span class="visually-hidden">{{ option.title }}</span>
    </a>
  }
</div>
