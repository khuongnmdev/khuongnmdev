<!--
  A link, not a `role="switch"`: switch semantics promise a state that
  changes in place, while this control goes to another page, and a link
  with a clear name says exactly that. `hreflang` names the language it
  leads to. Its tooltip and the hidden label that forms its accessible name
  are written in the language of the current page, so the link carries no
  `lang` and inherits the page's. The visible codes and the thumb are
  decoration for sighted visitors: hidden from assistive technology, each
  code carries its own language. `&ngsp;` keeps real spaces between the
  codes and the label, which Angular's whitespace stripping would otherwise
  glue into "ENVIView in Vietnamese" for anything reading the raw HTML;
  inside the grid link they never render.
-->
<a
  class="lang-toggle"
  [class.thumb-end]="thumbAtEnd()"
  [class.sliding]="sliding()"
  [routerLink]="target()"
  [attr.hreflang]="other()"
  [title]="name()"
>
  <span class="lang-thumb" aria-hidden="true"></span>
  @for (code of codes; track code.locale) {
    <span
      class="lang-code"
      [class.on-thumb]="code.locale === thumb()"
      aria-hidden="true"
      [attr.lang]="code.locale"
      >{{ code.label }}</span
    >&ngsp;
  }
  <span class="visually-hidden">{{ name() }}</span>
</a>
