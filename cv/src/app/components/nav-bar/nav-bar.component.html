<div class="nav-bar" [ngClass]="{ collapsed: isCollapsed(), animating: isAnimating() }">
  <!-- Desktop only: shrinks the sidebar to an icon rail. Sits on the panel's
       right edge, so it must live inside the panel for the absolute offset. -->
  <button
    type="button"
    class="btn btn-collapse"
    (click)="toggleCollapse()"
    [attr.aria-expanded]="!isCollapsed()"
    [attr.aria-label]="isCollapsed() ? ui().expandMenu : ui().collapseMenu"
    [title]="isCollapsed() ? ui().expandMenu : ui().collapseMenu"
  >
    @if (isCollapsed()) {
    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    } @else {
    <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
    }
  </button>

  <div class="avatar-block d-flex">
    <img class="img-fluid" [src]="profile().avatar" [alt]="profile().fullName" />
  </div>

  <!-- Real links to each section of the page in the current language, so
       they are crawlable, focusable, and work without scripts; the click
       handler adds the smooth scroll. -->
  <nav class="nav-list" [attr.aria-label]="ui().sectionNavigation">
    @for (menuItem of menuList(); track menuItem.id) {
    <a
      class="nav-item"
      [ngClass]="{ activated: menuItem.id === activatedItem() }"
      [routerLink]="homeLink()"
      [fragment]="menuItem.id"
      [replaceUrl]="true"
      [title]="menuItem.title"
      [attr.aria-label]="menuItem.title"
      (click)="navigateTo(menuItem)"
    >
      <span class="nav-icon"><i [class]="iconFor(menuItem)" aria-hidden="true"></i></span>
      <span class="nav-label">{{ menuItem.title }}</span>
    </a>
    }
  </nav>

  <!-- The sidebar's top row on desktop (via order), the right side of the bar
       on mobile — the export button keeps working in every state. -->
  <div class="top-actions">
    <button
      type="button"
      class="btn btn-icon btn-theme"
      (click)="toggleTheme()"
      [attr.aria-label]="theme() === 'dark' ? ui().switchLight : ui().switchDark"
      [title]="theme() === 'dark' ? ui().switchLight : ui().switchDark"
    >
      @if (theme() === 'dark') {
      <i class="fa-solid fa-sun" aria-hidden="true"></i>
      } @else {
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
      }
    </button>
    @if (hasLanguageChoice) {
    <app-language-toggle />
    }
    <a
      class="btn btn-icon btn-export"
      [routerLink]="printLink()"
      [title]="ui().exportPdf"
      (click)="closeMenu()"
    >
      <i class="fa-solid fa-file-pdf" aria-hidden="true"></i>
      <span class="visually-hidden">{{ ui().exportPdf }}</span>
    </a>
  </div>

  <button
    type="button"
    class="btn btn-menu"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isShowMenu()"
    [attr.aria-label]="isShowMenu() ? ui().closeMenu : ui().openMenu"
    [title]="isShowMenu() ? ui().closeMenu : ui().openMenu"
  >
    @if (isShowMenu()) {
    <i class="fa-solid fa-circle-xmark" aria-hidden="true"></i>
    } @else {
    <i class="fa-solid fa-bars" aria-hidden="true"></i>
    }
  </button>
</div>

<nav
  class="nav-list-mobile"
  [ngClass]="{ 'is-show': isShowMenu() }"
  [attr.aria-label]="ui().sectionMenu"
>
  @for (menuItem of menuList(); track menuItem.id) {
  <a
    class="nav-item"
    [ngClass]="{ activated: menuItem.id === activatedItem() }"
    [routerLink]="homeLink()"
    [fragment]="menuItem.id"
    [replaceUrl]="true"
    (click)="navigateTo(menuItem)"
  >
    <span class="nav-icon"><i [class]="iconFor(menuItem)" aria-hidden="true"></i></span>
    <span class="nav-label">{{ menuItem.title }}</span>
  </a>
  }
</nav>
